<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><!---->
  <title>音程チェッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
      <!--
    <div class="title">
      <h2 class="subtitle">直感的にとてもわかりやすい</h2>
      <h1><span class="title-part1">音程</span><span class="title-part2">チェッカー</span></h1>
    </div>-->
  </header>

  <div class="stage">
    <img id="pitch-image" alt="">
    <span id="hz-readout">-- Hz</span>
  </div>

  <footer>
    <button id="start-btn">マイクON</button>
    <p id="status"></p>

    <button id="settings-toggle" class="link-btn">⚙ 詳細設定</button>

    <div id="settings-panel" hidden>
      <div class="setting">
        <label>音量のしきい値 <span class="value" id="rms-val"></span></label>
        <input type="range" id="rms-range" min="0" max="0.1" step="0.001">
        <p class="desc">大きくすると小さい音を無視します（雑音に強く／反応は鈍く）。</p>
      </div>

      <div class="setting">
        <label>なめらかさ <span class="value" id="smoothing-val"></span></label>
        <input type="range" id="smoothing-range" min="1" max="20" step="1">
        <p class="desc">大きくするとちらつきが減ります（反応はやや遅く）。</p>
      </div>
    </div>
  </footer>

  <img class="background" src="images/background.png" alt="背景">

  <script src="audio_analyzer.js"></script>
  <script src="app.js"></script>
</body>
</html>
