<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Analyzer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: monospace;
  background: #fff;
  color: #000;
  padding: 24px;
}
@media (prefers-color-scheme: dark) {
  body { background: #111; color: #eee; }
}
h1 { font-size: 14px; font-weight: normal; margin-bottom: 20px; }
canvas {
  display: block;
  width: 100%;
  height: 180px;
  border: 1px solid #ccc;
  background: #f8f8f8;
  margin-bottom: 12px;
}
@media (prefers-color-scheme: dark) {
  canvas { border-color: #333; background: #1a1a1a; }
}
.metrics {
  display: flex;
  gap: 24px;
  margin-bottom: 16px;
  font-size: 13px;
}
.metric span { color: #888; margin-right: 6px; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button {
  font-family: monospace;
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid #ccc;
  background: transparent;
  cursor: pointer;
  color: inherit;
}
button:hover { background: #f0f0f0; }
button.active { border-color: #000; background: #000; color: #fff; }
@media (prefers-color-scheme: dark) {
  button { border-color: #444; }
  button:hover { background: #222; }
  button.active { border-color: #eee; background: #eee; color: #000; }
}
label { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=range] { width: 80px; }
#noise-level { font-size: 12px; min-width: 20px; }
.sep { color: #ccc; }
</style>
</head>
<body>
<h1>Audio Analyzer</h1>
<canvas id="canvas"></canvas>
<div class="metrics">
  <div><span>Peak</span><b id="peak">—</b> Hz</div>
  <div><span>文字</span><b id="kana" style="font-size:20px">—</b></div>
  <div><span>dB</span><b id="db">—</b></div>
  <div><span>RMS</span><b id="rms">—</b> %</div>
</div>
<div class="controls">
  <button id="btn-start" onclick="toggleRecording()">START</button>
  <span class="sep">|</span>
  <button id="btn-spectrum" class="active" onclick="setMode('spectrum')">SPECTRUM</button>
  <button id="btn-waveform" onclick="setMode('waveform')">WAVEFORM</button>
  <span class="sep">|</span>
  <label>
    <input type="checkbox" id="nc-toggle" onchange="toggleNC()"> NC
  </label>
  <label>
    threshold <input type="range" id="nc-thresh" min="0" max="80" value="20" oninput="updateThresh(this.value)"> <span id="noise-level">20</span>
  </label>
</div>

<script>
let audioCtx, analyser, source, stream, noiseGate;
let animId, isRecording = false, mode = 'spectrum';
let ncEnabled = false, ncThreshold = 20;

const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんあいうえおかきくけこさしすせそ'.split('').slice(0, 50);
const FREQ_MIN = 160, FREQ_MAX = 1300;

function freqToKana(hz) {
  if (hz < FREQ_MIN || hz > FREQ_MAX) return '—';
  const step = (FREQ_MAX - FREQ_MIN) / 49;
  const idx = Math.round((hz - FREQ_MIN) / step);
  return KANA[Math.min(Math.max(idx, 0), 49)];
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function dark() { return matchMedia('(prefers-color-scheme: dark)').matches; }

function resize() {
  const dpr = devicePixelRatio || 1;
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-spectrum').classList.toggle('active', m === 'spectrum');
  document.getElementById('btn-waveform').classList.toggle('active', m === 'waveform');
}

function toggleNC() {
  ncEnabled = document.getElementById('nc-toggle').checked;
  if (analyser) applyNC();
}

function updateThresh(v) {
  ncThreshold = +v;
  document.getElementById('noise-level').textContent = v;
}

function applyNC() {
  if (!audioCtx) return;
  if (ncEnabled) {
    noiseGate = audioCtx.createDynamicsCompressor();
    noiseGate.threshold.value = -90 + ncThreshold;
    noiseGate.knee.value = 0;
    noiseGate.ratio.value = 20;
    noiseGate.attack.value = 0.005;
    noiseGate.release.value = 0.1;
    source.disconnect();
    source.connect(noiseGate);
    noiseGate.connect(analyser);
  } else {
    source.disconnect();
    if (noiseGate) { noiseGate.disconnect(); noiseGate = null; }
    source.connect(analyser);
  }
}

function drawIdle() {
  resize();
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  ctx.fillStyle = dark() ? '#1a1a1a' : '#f8f8f8';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = dark() ? '#444' : '#ccc';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('NO INPUT', w / 2, h / 2);
}

function draw(freq, time, bufLen, sr) {
  const w = canvas.offsetWidth, h = canvas.offsetHeight;
  ctx.fillStyle = dark() ? '#1a1a1a' : '#f8f8f8';
  ctx.fillRect(0, 0, w, h);

  if (mode === 'spectrum') {
    const bars = Math.min(bufLen, 512);
    const bw = w / bars;
    for (let i = 0; i < bars; i++) {
      const v = freq[i] / 255;
      if (ncEnabled && freq[i] < ncThreshold) continue;
      const bh = v * h;
      ctx.fillStyle = dark() ? '#7dd3fc' : '#2563eb';
      ctx.fillRect(i * bw, h - bh, bw - 0.5, bh);
    }
    ctx.fillStyle = dark() ? '#555' : '#aaa';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    [100, 500, 1000, 2000, 5000, 10000].forEach(f => {
      const x = (f / (sr / 2)) * Math.min(bufLen, 512) * bw;
      if (x < w - 10) ctx.fillText(f >= 1000 ? (f/1000)+'k' : f, x, h - 3);
    });
  } else {
    ctx.strokeStyle = dark() ? '#555' : '#ddd';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
    ctx.beginPath();
    ctx.strokeStyle = dark() ? '#7dd3fc' : '#2563eb';
    ctx.lineWidth = 1.2;
    const sw = w / bufLen;
    for (let i = 0; i < bufLen; i++) {
      const y = (time[i] / 128) * h / 2;
      i === 0 ? ctx.moveTo(0, y) : ctx.lineTo(i * sw, y);
    }
    ctx.stroke();
  }
}

function getPeak(freq, bufLen, sr) {
  let max = 0, idx = 0;
  for (let i = 1; i < bufLen; i++) if (freq[i] > max) { max = freq[i]; idx = i; }
  return Math.round(idx * sr / (2 * bufLen));
}

function getRMS(time) {
  let s = 0;
  for (let i = 0; i < time.length; i++) { const v = (time[i]-128)/128; s += v*v; }
  return Math.round(Math.sqrt(s/time.length)*100);
}

function loop() {
  const bufLen = analyser.frequencyBinCount;
  const freq = new Uint8Array(bufLen);
  const time = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(time);
  draw(freq, time, bufLen, audioCtx.sampleRate);
  const peak = getPeak(freq, bufLen, audioCtx.sampleRate);
  const maxV = Math.max(...freq);
  const db = maxV === 0 ? '—' : Math.round(20*Math.log10(maxV/255));
  document.getElementById('peak').textContent = peak;
  document.getElementById('kana').textContent = freqToKana(peak);
  document.getElementById('db').textContent = db;
  document.getElementById('rms').textContent = getRMS(time);
  animId = requestAnimationFrame(loop);
}

async function toggleRecording() {
  const btn = document.getElementById('btn-start');
  if (!isRecording) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaStreamSource(stream);
      applyNC();
      isRecording = true;
      btn.textContent = 'STOP';
      btn.classList.add('active');
      loop();
    } catch(e) {
      btn.textContent = 'MIC ERROR';
    }
  } else {
    cancelAnimationFrame(animId);
    stream.getTracks().forEach(t => t.stop());
    audioCtx.close();
    analyser = source = noiseGate = null;
    isRecording = false;
    btn.textContent = 'START';
    btn.classList.remove('active');
    ['peak','kana','db','rms'].forEach(id => document.getElementById(id).textContent = '—');
    drawIdle();
  }
}

window.addEventListener('resize', () => { if (!isRecording) drawIdle(); });
drawIdle();
</script>
</body>
</html>
