<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音程チェッカー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #12112a;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 24px 16px 12px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 0.05em;
      opacity: 0.55;
    }

    h1 {
      font-size: clamp(24px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: 0.03em;
      margin-top: 4px;
    }

    /* 画像を表示するエリア */
    .stage {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #pitch-image {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      will-change: opacity;
    }

    #pitch-image.visible {
      opacity: 1;
    }

    footer {
      padding: 20px 16px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #start-btn {
      background: #fff;
      color: #12112a;
      border: none;
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 100px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.15s, transform 0.1s;
    }

    #start-btn:hover { opacity: 0.85; }
    #start-btn:active { transform: scale(0.97); }

    #status {
      font-size: 12px;
      opacity: 0.4;
      height: 16px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <header>
    <p class="subtitle">直感的にとてもわかりやすい</p>
    <h1>音程チェッカー</h1>
  </header>

  <div class="stage">
    <img id="pitch-image" alt="">
  </div>

  <footer>
    <button id="start-btn">マイクをONにする</button>
    <p id="status"></p>
  </footer>

  <script src="audio_analyzer.js"></script>
  <script>
    const imgEl  = document.getElementById('pitch-image');
    const btn    = document.getElementById('start-btn');
    const status = document.getElementById('status');

    const MIN_FREQ = 80;
    const MAX_FREQ = 1200;

    // 音の低い順 → 高い順に並べた画像ファイル名（低音=最初, 高音=最後）
    const IMAGE_FILES = ['レイヤー 0.png', 'レイヤー 0 のコピー.png'];
    for (let i = 2; i <= 35; i++) IMAGE_FILES.push(`レイヤー 0 のコピー ${i}.png`);

    // プリロードしておき、表示時のちらつきを防ぐ
    const preloaded = IMAGE_FILES.map(name => {
      const im = new Image();
      im.src = 'images/' + encodeURIComponent(name);
      return im;
    });

    let analyzer    = null;
    let running     = false;
    let currentIdx  = -1;

    function updateVisual(freq) {
      if (freq < 0) {
        imgEl.classList.remove('visible');
        return;
      }
      const t   = Math.max(0, Math.min(1, (freq - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)));
      const idx = Math.min(IMAGE_FILES.length - 1, Math.floor(t * IMAGE_FILES.length));
      if (idx !== currentIdx) {
        currentIdx = idx;
        imgEl.src  = preloaded[idx].src;
      }
      imgEl.classList.add('visible');
    }

    btn.addEventListener('click', async () => {
      if (!running) {
        try {
          status.textContent = '起動中...';
          analyzer = new AudioAnalyzer(updateVisual);
          await analyzer.start();
          running = true;
          btn.textContent    = 'マイクをOFFにする';
          status.textContent = '声や音を入力してください';
        } catch {
          status.textContent = 'マイクへのアクセスが拒否されました';
        }
      } else {
        analyzer.stop();
        running = false;
        currentIdx = -1;
        btn.textContent    = 'マイクをONにする';
        status.textContent = '';
        imgEl.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
