<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音程チェッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <p class="subtitle">直感的にとてもわかりやすい</p>
    <h1>音程チェッカー</h1>
  </header>

  <div class="stage">
    <img id="pitch-image" alt="">
    <span id="hz-readout">-- Hz</span>
  </div>

  <footer>
    <button id="start-btn">マイクをONにする</button>
    <p id="status"></p>

    <button id="monitor-toggle" class="link-btn">🔊 モニター: OFF</button>
    <button id="settings-toggle" class="link-btn">⚙ 詳細設定</button>

    <div id="settings-panel" hidden>
      <div class="setting setting-check">
        <label><input type="checkbox" id="ns-check"> ブラウザのノイズ抑制</label>
        <p class="desc">強すぎると感じたらオフに。素の音を拾うので楽器のチューニング向きです。</p>
      </div>

      <div class="setting">
        <label>音量のしきい値 <span class="value" id="rms-val"></span></label>
        <input type="range" id="rms-range" min="0" max="0.1" step="0.001">
        <p class="desc">大きくすると小さい音を無視します（雑音に強く／反応は鈍く）。</p>
      </div>

      <div class="setting">
        <label>明瞭度のしきい値 <span class="value" id="clarity-val"></span></label>
        <input type="range" id="clarity-range" min="0" max="0.99" step="0.01">
        <p class="desc">0で判定なし。大きいほど「はっきりした音」だけに反応します（ノイズ除去）。</p>
      </div>

      <div class="setting">
        <label>なめらかさ <span class="value" id="smoothing-val"></span></label>
        <input type="range" id="smoothing-range" min="1" max="15" step="1">
        <p class="desc">大きくするとちらつきが減ります（反応はやや遅く）。</p>
      </div>
    </div>
  </footer>

  <script src="audio_analyzer.js"></script>
  <script>
    const imgEl  = document.getElementById('pitch-image');
    const hzEl   = document.getElementById('hz-readout');
    const btn    = document.getElementById('start-btn');
    const status = document.getElementById('status');

    const MIN_FREQ = 70;
    const MAX_FREQ = 1500;

    // 音の低い順 → 高い順に並べた画像ファイル名（低音=最初, 高音=最後）
    const IMAGE_FILES = ['レイヤー 0.png', 'レイヤー 0 のコピー.png'];
    for (let i = 2; i <= 35; i++) IMAGE_FILES.push(`レイヤー 0 のコピー ${i}.png`);

    // プリロードしておき、表示時のちらつきを防ぐ
    const preloaded = IMAGE_FILES.map(name => {
      const im = new Image();
      im.src = 'images/' + encodeURIComponent(name);
      return im;
    });

    let analyzer    = null;
    let running     = false;
    let currentIdx  = -1;
    let monitorOn   = false;

    // 調整可能なパラメータ（スライダー・チェックボックスと連動）
    // 既定は「小さい音を無視する（音量しきい値）」だけを使う。
    // ブラウザのノイズ抑制と明瞭度判定はオフ（明瞭度0 = 判定なし）。
    const settings = {
      rmsThreshold: 0.015,
      clarityThreshold: 0,
      smoothing: 5,
      noiseSuppression: false
    };

    // スライダー1つを settings の1キーに結びつける
    function bindSlider(rangeId, valId, key, decimals) {
      const range = document.getElementById(rangeId);
      const valEl = document.getElementById(valId);
      range.value = settings[key];
      valEl.textContent = Number(settings[key]).toFixed(decimals);
      range.addEventListener('input', () => {
        const v = Number(range.value);
        settings[key] = v;
        valEl.textContent = v.toFixed(decimals);
        // 計測中なら即座に反映
        if (analyzer) analyzer[key] = v;
      });
    }

    bindSlider('rms-range', 'rms-val', 'rmsThreshold', 3);
    bindSlider('clarity-range', 'clarity-val', 'clarityThreshold', 2);
    bindSlider('smoothing-range', 'smoothing-val', 'smoothing', 0);

    // ブラウザのノイズ抑制チェックボックス
    const nsCheck = document.getElementById('ns-check');
    nsCheck.checked = settings.noiseSuppression;
    nsCheck.addEventListener('change', () => {
      settings.noiseSuppression = nsCheck.checked;
      if (analyzer) analyzer.setNoiseSuppression(nsCheck.checked);
    });

    document.getElementById('settings-toggle').addEventListener('click', () => {
      const panel = document.getElementById('settings-panel');
      panel.hidden = !panel.hidden;
    });

    const monitorBtn = document.getElementById('monitor-toggle');
    monitorBtn.addEventListener('click', () => {
      monitorOn = !monitorOn;
      monitorBtn.textContent = '🔊 モニター: ' + (monitorOn ? 'ON' : 'OFF');
      if (analyzer) analyzer.setMonitor(monitorOn);
      // ハウリング防止のため、ON時はヘッドホン推奨を知らせる
      if (monitorOn && running) status.textContent = 'ハウリング防止のためヘッドホン推奨';
    });

    function updateVisual(freq) {
      if (freq < 0) {
        imgEl.classList.remove('visible');
        hzEl.textContent = '-- Hz';
        return;
      }
      hzEl.textContent = Math.round(freq) + ' Hz';
      const t   = Math.max(0, Math.min(1, (freq - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)));
      const idx = Math.min(IMAGE_FILES.length - 1, Math.floor(t * IMAGE_FILES.length));
      if (idx !== currentIdx) {
        currentIdx = idx;
        imgEl.src  = preloaded[idx].src;
      }
      imgEl.classList.add('visible');
    }

    btn.addEventListener('click', async () => {
      if (!running) {
        try {
          status.textContent = '起動中...';
          analyzer = new AudioAnalyzer(updateVisual, { ...settings, monitor: monitorOn });
          await analyzer.start();
          running = true;
          btn.textContent    = 'マイクをOFFにする';
          status.textContent = '声や音を入力してください';
        } catch {
          status.textContent = 'マイクへのアクセスが拒否されました';
        }
      } else {
        analyzer.stop();
        running = false;
        currentIdx = -1;
        btn.textContent    = 'マイクをONにする';
        status.textContent = '';
        imgEl.classList.remove('visible');
        hzEl.textContent   = '-- Hz';
      }
    });
  </script>
</body>
</html>
