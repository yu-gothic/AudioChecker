<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音程チェッカー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #12112a;
      color: #fff;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 24px 16px 12px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 0.05em;
      opacity: 0.55;
    }

    h1 {
      font-size: clamp(24px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: 0.03em;
      margin-top: 4px;
    }

    /* 画像を表示するエリア */
    .stage {
      flex: 1;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #pitch-image {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.12s ease-out;
      will-change: opacity;
    }

    #pitch-image.visible {
      opacity: 1;
    }

    /* 一応のHz表示 */
    #hz-readout {
      position: absolute;
      bottom: 14px;
      right: 16px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      opacity: 0.55;
      letter-spacing: 0.05em;
      pointer-events: none;
      mix-blend-mode: difference;
    }

    footer {
      padding: 20px 16px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #start-btn {
      background: #fff;
      color: #12112a;
      border: none;
      padding: 14px 36px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 100px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: opacity 0.15s, transform 0.1s;
    }

    #start-btn:hover { opacity: 0.85; }
    #start-btn:active { transform: scale(0.97); }

    #status {
      font-size: 12px;
      opacity: 0.4;
      height: 16px;
      letter-spacing: 0.04em;
    }

    /* 詳細設定 */
    .link-btn {
      background: none;
      border: none;
      color: #fff;
      opacity: 0.5;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.04em;
      padding: 4px;
    }
    .link-btn:hover { opacity: 0.8; }

    #settings-panel {
      width: min(420px, 90vw);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #settings-panel[hidden] { display: none; }

    .setting label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      opacity: 0.75;
      margin-bottom: 6px;
      letter-spacing: 0.03em;
    }
    .setting .value { opacity: 1; font-variant-numeric: tabular-nums; }

    .setting input[type="range"] {
      width: 100%;
      accent-color: #fff;
      cursor: pointer;
    }

    .setting .desc {
      font-size: 10.5px;
      opacity: 0.4;
      margin-top: 4px;
      line-height: 1.4;
    }

    .setting-check label {
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: 0.9;
      margin-bottom: 0;
    }
    .setting-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <p class="subtitle">直感的にとてもわかりやすい</p>
    <h1>音程チェッカー</h1>
  </header>

  <div class="stage">
    <img id="pitch-image" alt="">
    <span id="hz-readout">-- Hz</span>
  </div>

  <footer>
    <button id="start-btn">マイクをONにする</button>
    <p id="status"></p>

    <button id="monitor-toggle" class="link-btn">🔊 モニター: OFF</button>
    <button id="settings-toggle" class="link-btn">⚙ 詳細設定</button>

    <div id="settings-panel" hidden>
      <div class="setting setting-check">
        <label><input type="checkbox" id="ns-check"> ブラウザのノイズ抑制</label>
        <p class="desc">強すぎると感じたらオフに。素の音を拾うので楽器のチューニング向きです。</p>
      </div>

      <div class="setting">
        <label>音量のしきい値 <span class="value" id="rms-val"></span></label>
        <input type="range" id="rms-range" min="0" max="0.1" step="0.001">
        <p class="desc">大きくすると小さい音を無視します（雑音に強く／反応は鈍く）。</p>
      </div>

      <div class="setting">
        <label>明瞭度のしきい値 <span class="value" id="clarity-val"></span></label>
        <input type="range" id="clarity-range" min="0.5" max="0.99" step="0.01">
        <p class="desc">大きいほど「はっきりした音」だけに反応します（ノイズ除去）。</p>
      </div>

      <div class="setting">
        <label>なめらかさ <span class="value" id="smoothing-val"></span></label>
        <input type="range" id="smoothing-range" min="1" max="15" step="1">
        <p class="desc">大きくするとちらつきが減ります（反応はやや遅く）。</p>
      </div>
    </div>
  </footer>

  <script src="audio_analyzer.js"></script>
  <script>
    const imgEl  = document.getElementById('pitch-image');
    const hzEl   = document.getElementById('hz-readout');
    const btn    = document.getElementById('start-btn');
    const status = document.getElementById('status');

    const MIN_FREQ = 80;
    const MAX_FREQ = 1200;

    // 音の低い順 → 高い順に並べた画像ファイル名（低音=最初, 高音=最後）
    const IMAGE_FILES = ['レイヤー 0.png', 'レイヤー 0 のコピー.png'];
    for (let i = 2; i <= 35; i++) IMAGE_FILES.push(`レイヤー 0 のコピー ${i}.png`);

    // プリロードしておき、表示時のちらつきを防ぐ
    const preloaded = IMAGE_FILES.map(name => {
      const im = new Image();
      im.src = 'images/' + encodeURIComponent(name);
      return im;
    });

    let analyzer    = null;
    let running     = false;
    let currentIdx  = -1;
    let monitorOn   = false;

    // 調整可能なパラメータ（スライダー・チェックボックスと連動）
    const settings = {
      rmsThreshold: 0.015,
      clarityThreshold: 0.85,
      smoothing: 5,
      noiseSuppression: true
    };

    // スライダー1つを settings の1キーに結びつける
    function bindSlider(rangeId, valId, key, decimals) {
      const range = document.getElementById(rangeId);
      const valEl = document.getElementById(valId);
      range.value = settings[key];
      valEl.textContent = Number(settings[key]).toFixed(decimals);
      range.addEventListener('input', () => {
        const v = Number(range.value);
        settings[key] = v;
        valEl.textContent = v.toFixed(decimals);
        // 計測中なら即座に反映
        if (analyzer) analyzer[key] = v;
      });
    }

    bindSlider('rms-range', 'rms-val', 'rmsThreshold', 3);
    bindSlider('clarity-range', 'clarity-val', 'clarityThreshold', 2);
    bindSlider('smoothing-range', 'smoothing-val', 'smoothing', 0);

    // ブラウザのノイズ抑制チェックボックス
    const nsCheck = document.getElementById('ns-check');
    nsCheck.checked = settings.noiseSuppression;
    nsCheck.addEventListener('change', () => {
      settings.noiseSuppression = nsCheck.checked;
      if (analyzer) analyzer.setNoiseSuppression(nsCheck.checked);
    });

    document.getElementById('settings-toggle').addEventListener('click', () => {
      const panel = document.getElementById('settings-panel');
      panel.hidden = !panel.hidden;
    });

    const monitorBtn = document.getElementById('monitor-toggle');
    monitorBtn.addEventListener('click', () => {
      monitorOn = !monitorOn;
      monitorBtn.textContent = '🔊 モニター: ' + (monitorOn ? 'ON' : 'OFF');
      if (analyzer) analyzer.setMonitor(monitorOn);
      // ハウリング防止のため、ON時はヘッドホン推奨を知らせる
      if (monitorOn && running) status.textContent = 'ハウリング防止のためヘッドホン推奨';
    });

    function updateVisual(freq) {
      if (freq < 0) {
        imgEl.classList.remove('visible');
        hzEl.textContent = '-- Hz';
        return;
      }
      hzEl.textContent = Math.round(freq) + ' Hz';
      const t   = Math.max(0, Math.min(1, (freq - MIN_FREQ) / (MAX_FREQ - MIN_FREQ)));
      const idx = Math.min(IMAGE_FILES.length - 1, Math.floor(t * IMAGE_FILES.length));
      if (idx !== currentIdx) {
        currentIdx = idx;
        imgEl.src  = preloaded[idx].src;
      }
      imgEl.classList.add('visible');
    }

    btn.addEventListener('click', async () => {
      if (!running) {
        try {
          status.textContent = '起動中...';
          analyzer = new AudioAnalyzer(updateVisual, { ...settings, monitor: monitorOn });
          await analyzer.start();
          running = true;
          btn.textContent    = 'マイクをOFFにする';
          status.textContent = '声や音を入力してください';
        } catch {
          status.textContent = 'マイクへのアクセスが拒否されました';
        }
      } else {
        analyzer.stop();
        running = false;
        currentIdx = -1;
        btn.textContent    = 'マイクをONにする';
        status.textContent = '';
        imgEl.classList.remove('visible');
        hzEl.textContent   = '-- Hz';
      }
    });
  </script>
</body>
</html>
