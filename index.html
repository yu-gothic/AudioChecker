<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Analyzer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: monospace;
  background: #fff;
  color: #000;
  padding: 24px;
}
@media (prefers-color-scheme: dark) {
  body { background: #111; color: #eee; }
}
h1 { font-size: 14px; font-weight: normal; margin-bottom: 20px; }
#big-display { font-size: 72px; font-weight: 500; letter-spacing: -2px; margin-bottom: 4px; line-height: 1; }
#big-unit { font-size: 16px; color: #888; margin-bottom: 6px; }
#big-kana { font-size: 52px; margin-bottom: 24px; color: #888; }
.metrics {
  display: flex;
  gap: 24px;
  margin-bottom: 16px;
  font-size: 13px;
}
.metrics span { color: #888; margin-right: 6px; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
button {
  font-family: monospace;
  font-size: 12px;
  padding: 6px 14px;
  border: 1px solid #ccc;
  background: transparent;
  cursor: pointer;
  color: inherit;
}
button:hover { background: #f0f0f0; }
button.active { border-color: #000; background: #000; color: #fff; }
@media (prefers-color-scheme: dark) {
  button { border-color: #444; }
  button:hover { background: #222; }
  button.active { border-color: #eee; background: #eee; color: #000; }
}
label { font-size: 12px; color: #888; display: flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=range] { width: 80px; }
.sep { color: #ccc; }
#nc-status { font-size: 11px; color: #888; margin-left: 4px; }
</style>
</head>
<body>
<h1>Audio Analyzer</h1>
<div id="big-display">—</div>
<div id="big-unit">Hz</div>
<div id="big-kana">—</div>
<div class="metrics">
  <div><span>dB</span><b id="db">—</b></div>
  <div><span>RMS</span><b id="rms">—</b> %</div>
</div>
<div class="controls">
  <button id="btn-start" onclick="toggleRecording()">START</button>
  <span class="sep">|</span>
  <label><input type="checkbox" id="nc-toggle" onchange="toggleNC()"> RNNoise NC</label>
  <span id="nc-status"></span>
  <span class="sep">|</span>
  <label><input type="checkbox" id="monitor-toggle" onchange="toggleMonitor()"> モニター</label>
</div>
<audio id="monitor-audio" autoplay></audio>

<script src="https://cdn.jsdelivr.net/npm/@shiguredo/noise-suppression@latest/dist/noise_suppression.js"></script>
<script>
const KANA = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんあいうえおかきくけこさしすせそ'.split('').slice(0, 50);
const FREQ_MIN = 160, FREQ_MAX = 1300;
const ASSETS_PATH = 'https://cdn.jsdelivr.net/npm/@shiguredo/noise-suppression@latest/dist';

let audioCtx, analyser, source, stream;
let animId, isRecording = false;
let ncEnabled = false, monitorEnabled = false;
let rnProcessor = null, processedTrack = null;
let monitorDest = null;

function freqToKana(hz) {
  if (hz < FREQ_MIN || hz > FREQ_MAX) return '—';
  const idx = Math.round((hz - FREQ_MIN) / ((FREQ_MAX - FREQ_MIN) / 49));
  return KANA[Math.min(Math.max(idx, 0), 49)];
}

function getPeak(freq, bufLen, sr) {
  let max = 0, idx = 0;
  for (let i = 1; i < bufLen; i++) if (freq[i] > max) { max = freq[i]; idx = i; }
  return Math.round(idx * sr / (2 * bufLen));
}

function getRMS(time) {
  let s = 0;
  for (let i = 0; i < time.length; i++) { const v = (time[i]-128)/128; s += v*v; }
  return Math.round(Math.sqrt(s/time.length)*100);
}

function loop() {
  const bufLen = analyser.frequencyBinCount;
  const freq = new Uint8Array(bufLen);
  const time = new Uint8Array(bufLen);
  analyser.getByteFrequencyData(freq);
  analyser.getByteTimeDomainData(time);
  const peak = getPeak(freq, bufLen, audioCtx.sampleRate);
  const maxV = Math.max(...freq);
  const db = maxV === 0 ? '—' : Math.round(20 * Math.log10(maxV / 255));
  document.getElementById('big-display').textContent = peak;
  document.getElementById('big-kana').textContent = freqToKana(peak);
  document.getElementById('db').textContent = db;
  document.getElementById('rms').textContent = getRMS(time);
  animId = requestAnimationFrame(loop);
}

// RNNoiseを適用してanalyserに接続し直す
async function applyNC() {
  if (!audioCtx) return;
  const statusEl = document.getElementById('nc-status');

  // 既存のRNNoise処理を停止
  if (rnProcessor) {
    await rnProcessor.stopProcessing();
    rnProcessor = null;
    processedTrack = null;
  }
  source.disconnect();

  if (ncEnabled) {
    statusEl.textContent = '読み込み中...';
    try {
      const rawTrack = stream.getAudioTracks()[0];
      rnProcessor = new Shiguredo.NoiseSuppressionProcessor(ASSETS_PATH);
      processedTrack = await rnProcessor.startProcessing(rawTrack);

      // 処理済みトラックをAudioContextに戻す
      const processedStream = new MediaStream([processedTrack]);
      source = audioCtx.createMediaStreamSource(processedStream);
      source.connect(analyser);

      // モニターも再接続
      if (monitorEnabled && monitorDest) {
        source.connect(monitorDest);
      }
      statusEl.textContent = 'ON';
    } catch(e) {
      statusEl.textContent = 'ERROR';
      ncEnabled = false;
      document.getElementById('nc-toggle').checked = false;
      source.connect(analyser);
    }
  } else {
    source.connect(analyser);
    if (monitorEnabled && monitorDest) source.connect(monitorDest);
    statusEl.textContent = '';
  }
}

function toggleNC() {
  ncEnabled = document.getElementById('nc-toggle').checked;
  if (isRecording) applyNC();
}

function toggleMonitor() {
  monitorEnabled = document.getElementById('monitor-toggle').checked;
  if (!audioCtx) return;

  if (monitorEnabled) {
    monitorDest = audioCtx.createMediaStreamDestination();
    source.connect(monitorDest);
    document.getElementById('monitor-audio').srcObject = monitorDest.stream;
  } else {
    if (monitorDest) {
      try { source.disconnect(monitorDest); } catch(e) {}
      monitorDest = null;
    }
    document.getElementById('monitor-audio').srcObject = null;
  }
}

async function toggleRecording() {
  const btn = document.getElementById('btn-start');
  if (!isRecording) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, sampleRate: 48000, channelCount: 1 }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);

      if (ncEnabled) await applyNC();
      if (monitorEnabled) toggleMonitor();

      isRecording = true;
      btn.textContent = 'STOP';
      btn.classList.add('active');
      loop();
    } catch(e) {
      btn.textContent = 'MIC ERROR';
    }
  } else {
    cancelAnimationFrame(animId);
    if (rnProcessor) { await rnProcessor.stopProcessing(); rnProcessor = null; }
    stream.getTracks().forEach(t => t.stop());
    audioCtx.close();
    audioCtx = analyser = source = stream = monitorDest = null;
    isRecording = false;
    btn.textContent = 'START';
    btn.classList.remove('active');
    document.getElementById('monitor-audio').srcObject = null;
    document.getElementById('nc-status').textContent = '';
    document.getElementById('big-display').textContent = '—';
    document.getElementById('big-kana').textContent = '—';
    ['db','rms'].forEach(id => document.getElementById(id).textContent = '—');
  }
}
</script>
</body>
</html>
